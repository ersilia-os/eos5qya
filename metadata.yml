Identifier: eos5qya
Slug: antimicrobial-activity-ngonorrhoeae
Status: Ready
Title: Antimicrobial activity prediction against Neisseria gonorrhoeae from 
  public ChEMBL data
Description: Bioactivity prediction of growth inhibition in Neisseria 
  gonorrhoeae, trained as binary (active/inactive) classifiers from publicly 
  available data in ChEMBL. Independent models are trained on multiple 
  bioactivity datasets, corresponding to dose-response (MIC) assays. A ranking 
  score is provided for each model alongside a combined consensus score.
