Title: Antimicrobial activity prediction against Neisseria gonorrhoeae from public ChEMBL data
Description: Estimates activity against Neisseria gonorrhoeae, an organism that has developed resistance to every antibiotic class used against it and now threatens to become untreatable. Only one usable dose-response assay pool could be assembled from ChEMBL, so unlike the multi-model panels for better-studied pathogens this prediction rests on a single classifier with no consensus to fall back on. Confidence should be read accordingly, and the scarcity itself reflects how little public screening this pathogen has received.
